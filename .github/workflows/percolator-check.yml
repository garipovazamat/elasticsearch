name: percolator-check

on:
  push:
    branches: [ci/percolator-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Percolator precommit and tests
        run: >-
          ./gradlew --no-daemon --continue
          :modules:percolator:precommit
          :modules:percolator:test
          :modules:percolator:internalClusterTest
          :modules:percolator:yamlRestTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percolator-test-reports
          path: |
            modules/percolator/build/reports/
            modules/percolator/build/test-results/
          if-no-files-found: ignore
