name: percolator-check

on:
  push:
    branches: [ci/percolator-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Percolator precommit and tests
        run: >-
          ./gradlew --no-daemon --continue
          :modules:percolator:precommit
          :modules:percolator:test
          :modules:percolator:internalClusterTest
          :modules:percolator:yamlRestTest
      # Stores percolator queries with released 8.x and 9.x versions and reads them back after
      # a full cluster restart onto this branch. Runs even if the module checks above failed.
      - name: Percolator BWC test
        if: success() || failure()
        run: >-
          ./gradlew --no-daemon --continue
          ":qa:full-cluster-restart:v8.18.8#bwcTest" --tests "org.elasticsearch.upgrades.QueryBuilderBWCIT"
          ":qa:full-cluster-restart:v9.3.8#bwcTest" --tests "org.elasticsearch.upgrades.QueryBuilderBWCIT"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percolator-test-reports
          path: |
            modules/percolator/build/reports/
            modules/percolator/build/test-results/
            qa/full-cluster-restart/build/reports/
            qa/full-cluster-restart/build/test-results/
          if-no-files-found: ignore
